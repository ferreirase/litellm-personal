services:
  gateway-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-mcp
    ports:
      - "${PORT:-8081}:8081"
    volumes:
      # Mount home directory with same path structure
      - /home/ferreirase:/home/ferreirase
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEMORY_LIMIT:-1.5G}
          cpus: "${GATEWAY_CPU_LIMIT:-1.5}"
        reservations:
          memory: ${GATEWAY_MEMORY_RESERVATION:-512M}
          cpus: "${GATEWAY_CPU_RESERVATION:-0.25}"
    environment:
      # Workspace path inside container (allow full access)
      - WORKSPACE_PATH=/home/ferreirase/Documents
      - VECTOR_DB_PROVIDER=milvus
      - MILVUS_ADDRESS=milvus-standalone:19530
      - NODE_OPTIONS=--max-old-space-size=${GATEWAY_V8_HEAP_MB:-512}
      # Node environment
      - NODE_ENV=production
      # Log level (debug, info, warn, error)
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # Request timeout in milliseconds
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30000}
      # Claude Context MCP credentials (set values in Dokploy)
      - VOYAGEAI_API_KEY=${VOYAGEAI_API_KEY:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-VoyageAI}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-voyage-code-3}
      # Mastra Memory MCP
      - NODE_BINARY=${NODE_BINARY:-/home/ferreirase/.nvm/versions/node/v24.14.0/bin/node}
      - MASTRA_DATABASE_URL=${MASTRA_DATABASE_URL:-postgresql://mastra:mastra_password@mastra-memory-db:5432/mastra_memory}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Session management
      - SESSION_IDLE_TIMEOUT_MS=${SESSION_IDLE_TIMEOUT_MS:-1800000}
      - SESSION_MAX_PER_SERVER=${SESSION_MAX_PER_SERVER:-3}
      - INIT_CONCURRENCY=${INIT_CONCURRENCY:-3}
      - PATH=${GATEWAY_PATH:-/home/ferreirase/.nvm/versions/node/v24.14.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
    depends_on:
      mastra-memory-db:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    restart: unless-stopped
    # Security: run as non-root user (optional, uncomment if needed)
    user: "1000:1000"
    networks:
      - personal-litellm-ukykiw
      - dokploy-network # <-- adicionar
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8081/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  milvus-standalone:
    image: milvusdb/milvus:v2.5.9
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - personal-litellm-ukykiw
      - dokploy-network # <-- adicionar

  mastra-memory-db:
    image: pgvector/pgvector:pg16
    container_name: mastra-memory-db
    environment:
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra_password
      POSTGRES_DB: mastra_memory
    volumes:
      - mastra_postgres_data:/var/lib/postgresql/data
      - /home/ferreirase/Documents/Estudos/AI/ai-memory/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra_memory"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - personal-litellm-ukykiw
      - dokploy-network # <-- adicionar

networks:
  personal-litellm-ukykiw:
    external: true
  dokploy-network: # <-- adicionar
    external: true

volumes:
  mastra_postgres_data:
  milvus_data:
