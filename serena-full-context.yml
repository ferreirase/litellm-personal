description: Full context exposing all Serena tools for MCP proxy usage (excludes JetBrains)
prompt: |
  You are running in a coding agent context with full access to Serena's tools.
  Prioritize symbolic tools for efficient code exploration and editing.

excluded_tools: []

included_optional_tools:
  - switch_modes
  - delete_lines
  - replace_lines
  - insert_at_line
  - think_about_collected_information
  - think_about_task_adherence
  - think_about_whether_you_are_done
  - summarize_changes
  - restart_language_server
  - open_dashboard
  - remove_project

tool_description_overrides: {}
single_project: false
